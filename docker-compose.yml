services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    image: todo-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - db
  db:
    image: postgres:18
    container_name: todo-db
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql
    environment:
      POSTGRES_USER: 'todo_user'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'todo'
volumes:
  db-store: