services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    image: todo-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    container_name: todo-db
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql
    environment:
      POSTGRES_USER: 'todo_user'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'todo'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-store: